<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>森のしごと村</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しごと村">
<style>html,body{margin:0;padding:0;height:100%;background:#20301f}iframe{border:0;width:100%;height:100%;display:block}#ld{color:#cfe3c9;font:14px sans-serif;padding:24px;text-align:center}</style>
</head>
<body>
<div id="ld">読み込み中…</div>
<iframe id="f" title="森のしごと村" style="display:none"></iframe>
<script>
// 予備入口（Vercel等の静的ホスティング用）。
// 本体はSupabase Edge Function側にあり、ここは読み込むだけ。鍵・秘密は一切含まない。
(function(){
  var BASE = 'https://ngggmlbvnnrtklftdrkg.supabase.co/functions/v1/mura';
  var h = {};
  try { var t = localStorage.getItem('mura_t'); if (t) h['X-Mura-S'] = t; } catch(e){}
  fetch(BASE + '/page', {cache:'no-store', headers:h})
    .then(function(r){ if(!r.ok){ throw new Error('HTTP ' + r.status); } return r.text(); })
    .then(function(html){
      var f = document.getElementById('f');
      f.srcdoc = html; f.style.display = 'block';
      document.getElementById('ld').style.display = 'none';
    })
    .catch(function(e){ document.getElementById('ld').textContent = '読み込みに失敗しました。再読み込みしてください。(' + e + ')'; });
})();
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }
</script>
</body>
</html>
